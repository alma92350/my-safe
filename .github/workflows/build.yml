name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :vaultcore:test

  apk:
    runs-on: ubuntu-latest
    needs: core-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      # ubuntu-latest ships the Android SDK (ANDROID_HOME is set); just make sure the pieces we need exist.
      - name: Prepare Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore release keystore (optional)
        env:
          KEYSTORE_B64: ${{ secrets.MYSAFE_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/mysafe.jks"
            echo "MYSAFE_KEYSTORE=$RUNNER_TEMP/mysafe.jks" >> "$GITHUB_ENV"
          fi
      - name: Build APKs
        env:
          MYSAFE_KEYSTORE_PASSWORD: ${{ secrets.MYSAFE_KEYSTORE_PASSWORD }}
          MYSAFE_KEY_ALIAS: ${{ secrets.MYSAFE_KEY_ALIAS }}
          MYSAFE_KEY_PASSWORD: ${{ secrets.MYSAFE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleDebug :app:assembleRelease
      - name: Checksums
        run: cd app/build/outputs/apk && find . -name '*.apk' -exec sha256sum {} \; | tee "$GITHUB_WORKSPACE/SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: my-safe-apks
          path: |
            app/build/outputs/apk/**/*.apk
            SHA256SUMS.txt
