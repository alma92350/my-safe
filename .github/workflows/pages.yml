name: pages

# Manual deploy of the web app to GitHub Pages. Enable Pages (source: GitHub Actions) in the repo settings first.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site (without tests and tools)
        run: |
          mkdir _site
          cp -r web/. _site/
          rm -rf _site/test _site/tools _site/package.json _site/nginx.conf.example
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@v4
